// Top-level build file for MoonStream.
//
// Versions are pinned to what the sandbox's offline mirror (/home/hatch/localrepo)
// provides: AGP 8.2.0, Kotlin 1.9.22, Compose BOM 2023.08.00.
// TODO: bump to current versions (AGP 8.5+, Kotlin 2.x, latest BOM) once CI with
// network access is building this repo.
buildscript {
    repositories {
        maven { url '/home/hatch/localrepo' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
    }
    configurations.classpath {
        // AGP's sdk-common wants kotlin-reflect 1.8.20, which the offline
        // mirror doesn't carry — force the 1.9.22 that's present.
        resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-reflect:1.9.22' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
