// Top-level build file for MoonStream.
//
// Versions (experiment/compose-17-blur branch): AGP 8.5.2, Kotlin 2.0.20,
// Compose 1.7.0 — the smallest step that unlocks Haze backdrop blur.
// Main stays on AGP 8.4.2 / Kotlin 1.9.22 / Compose 1.6.1.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        // KAPT's bundled kotlinx-metadata-jvm only reads metadata up to
        // 2.0.0, but Haze's JetBrains Compose UI was compiled with Kotlin
        // 2.1 (metadata 2.1.0) — 0.9.0 teaches KAPT the newer format.
        classpath 'org.jetbrains.kotlinx:kotlinx-metadata-jvm:0.9.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.20'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
