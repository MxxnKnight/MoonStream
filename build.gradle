// Top-level build file for MoonStream.
//
// Versions (experiment/compose-17-blur branch): AGP 8.5.2, Kotlin 2.0.20,
// Compose 1.7.0 — the smallest step that unlocks Haze backdrop blur.
// Main stays on AGP 8.4.2 / Kotlin 1.9.22 / Compose 1.6.1.
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        // KSP (replaces KAPT for Room): KAPT cannot read Kotlin 2.1
        // metadata from Haze's JetBrains Compose UI, KSP can.
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.0.20-1.0.24'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.0.20'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
