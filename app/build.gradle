apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.moon.moonstream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.moon.moonstream'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '0.5.1'

        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Pinned release keystore: passwords live in keystore.properties
    // (project root, gitignored — never commit it). If the file is absent
    // (e.g. a fresh CI checkout), release builds fall back to unsigned.
    def ksPropsFile = new File(rootDir, 'keystore.properties')
    if (ksPropsFile.exists()) {
        def ksProps = new Properties()
        ksPropsFile.withInputStream { ksProps.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Release lint needs artifacts absent from the offline mirror; skip it here.
    // TODO: re-enable when CI builds with network access.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    // No BOM: the offline mirror mixes compose 1.5.x/1.6.x. We pin compose
    // artifacts to 1.6.1 (present in the mirror) and keep material3 1.1.1 /
    // material-icons-core 1.5.0 (only versions present).
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui:1.6.1'
    implementation 'androidx.compose.ui:ui-graphics:1.6.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.1'
    implementation 'androidx.compose.material3:material3:1.1.1'
    implementation 'androidx.compose.material:material-icons-extended:1.5.0'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.5.0'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        def g = details.requested.group
        def n = details.requested.name
        if (g.startsWith('androidx.compose')
            && g != 'androidx.compose.compiler'
            && !n.contains('test')
            && !(n in ['material3', 'material', 'material-ripple',
                       'material-icons-core', 'material-icons-extended',
                       'material-android', 'material-icons-core-android',
                       'material-ripple-android', 'material-icons-extended-android'])) {
            details.useVersion '1.6.1'
        }
        if (g == 'androidx.annotation') {
            details.useVersion(n == 'annotation-experimental' ? '1.3.0' : '1.7.0')
        }
        if (g == 'org.jetbrains.kotlinx') {
            details.useVersion '1.7.3'
        }
    }
}
