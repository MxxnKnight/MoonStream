apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace 'com.moon.moonstream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.moon.moonstream'
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName '0.8.3'

        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Shared debug keystore (committed): every CI/manual debug build gets the
    // same signature, so updates install over each other without conflicts.
    // This is the well-known public debug key — never use it for releases.
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Pinned release keystore: passwords live in keystore.properties
    // (project root, gitignored — never commit it). If the file is absent
    // (e.g. a fresh CI checkout), release builds fall back to unsigned.
    def ksPropsFile = new File(rootDir, 'keystore.properties')
    if (ksPropsFile.exists()) {
        def ksProps = new Properties()
        ksPropsFile.withInputStream { ksProps.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // "perf": a NON-debuggable build signed with the same shared key as
        // debug, so it installs over your current app as a normal update.
        // Debug builds run Compose several times slower (debuggable, no AOT
        // optimisation) - this is what makes tab switches feel laggy.
        // Flip minifyEnabled to true later (needs a test pass).
        perf {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }
    // Release lint needs artifacts absent from the offline mirror; skip it here.
    // TODO: re-enable when CI builds with network access.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
}

// guava-32.1.2-android.jar (bundled in libs/) already contains
// ListenableFuture — drop the standalone module CI resolves transitively,
// otherwise checkPerfDuplicateClasses fails the release build.
configurations.all {
    exclude group: "com.google.guava", module: "listenablefuture"
}

dependencies {
    // Compose 1.7.0 (experiment branch — main pins 1.6.1). No BOM, so the
    // versions are pinned individually to the 1.7.0 set.
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui:1.7.0'
    implementation 'androidx.compose.ui:ui-graphics:1.7.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.0'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended:1.7.0'
    // Haze backdrop blur for the bottom pill (experiment branch only).
    implementation 'dev.chrisbanes.haze:haze:1.3.0'


    // Room: on-phone library database (Phase 3 indexing)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Coil: real poster art in Library/Detail (mirror has 2.6.0).
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Media3 ExoPlayer: in-app video player (Phase 6).
    // Real Maven coordinates (NOT loose .aar files): Gradle then pulls every
    // module ExoPlayer needs at runtime - media3-extractor, -database,
    // guava, recyclerview... The old flat AARs were missing extractor and
    // database, so ExoPlayer.Builder(...).build() threw NoClassDefFoundError
    // the moment Play was pressed. (Local libs/*.aar are no longer used.)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.0'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        def g = details.requested.group
        def n = details.requested.name
        if (g.startsWith('androidx.compose')
            && g != 'androidx.compose.compiler'
            && !n.contains('test')
            && !(n in ['material3', 'material', 'material-ripple',
                       'material-icons-core', 'material-icons-extended',
                       'material-android', 'material-icons-core-android',
                       'material-ripple-android', 'material-icons-extended-android',
                       // Compose 1.7 split artifacts: material3's version is
                       // 1.3.0, not 1.7.0 — never force it to the compose version.
                       'material3-android'])) {
            details.useVersion '1.7.0'
        }
        if (g == 'androidx.annotation') {
            details.useVersion(n == 'annotation-experimental' ? '1.3.0' : '1.7.0')
        }
        if (g == 'org.jetbrains.kotlinx' && !n.startsWith('atomicfu')) {
            // atomicfu (and atomicfu-jvm etc.) is versioned 0.x, not with
            // coroutines — forcing it to 1.7.3 breaks resolution (Haze
            // pulls it in via JetBrains Compose UI).
            details.useVersion '1.7.3'
        }
    }
}

