name: Build Android APK

# Manual only — run it from the Actions tab with "Run workflow".
# - version: the release version, e.g. 0.9.0 (must match versionName in
#   app/build.gradle — bump it in the same push before running).
# - publish_release: when true, creates a GitHub Release tagged v<version>
#   with the per-ABI APKs attached, which is what the app's in-app
#   updater (Settings → Check for updates) reads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.9.0)"
        required: true
        default: "0.9.0"
      publish_release:
        description: "Publish a GitHub Release with the APKs (for OTA updates)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Rename APKs so the release assets carry the version + ABI.
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/debug
          for f in *arm64-v8a*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-arm64-v8a.apk"; done
          for f in *armeabi-v7a*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-armeabi-v7a.apk"; done
          for f in *x86_64*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-x86_64.apk"; done
          for f in *universal*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-universal.apk"; done
          ls -la

      # One artifact per ABI so each downloads as its own file.
      # The POCO M4 Pro needs arm64-v8a.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-universal
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn
          retention-days: 14

      # OTA: publish a GitHub Release so the in-app updater finds it.
      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MoonStream v${{ inputs.version }}
          body: |
            MoonStream v${{ inputs.version }}

            Install the APK matching your phone (most phones: arm64-v8a).
            Or update from inside the app: Settings → Check for updates.
          files: app/build/outputs/apk/debug/*.apk
