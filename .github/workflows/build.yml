name: Build Android APK

# Manual only — run it from the Actions tab with "Run workflow".
# - version: the release version, e.g. 0.9.0. The workflow writes this into
#   app/build.gradle as versionName (and bumps versionCode) before building,
#   so the APK's internal version always matches the release tag. This is
#   what the in-app updater compares — a mismatch caused the 0.8.2 "update
#   loop" bug (release said 0.8.2, APK inside still said 0.8.0).
# - publish_release: when true, creates a GitHub Release tagged v<version>
#   with the per-ABI APKs attached, which is what the app's in-app
#   updater (Settings → Check for updates) reads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.9.0)"
        required: true
        default: "0.9.0"
      publish_release:
        description: "Publish a GitHub Release with the APKs (for OTA updates)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Sync versionName from the workflow input and bump versionCode, so
      # the APK's internal version always matches the release tag. Without
      # this, a manually-typed version (e.g. 0.8.2) produces an APK that
      # still reports the old versionName (e.g. 0.8.0) — and the in-app
      # updater offers the "update" forever.
      - name: Sync version from input
        run: |
          VC=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          NEW_VC=$((VC + 1))
          sed -i -E "s/versionCode [0-9]+/versionCode $NEW_VC/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${{ inputs.version }}'/" app/build.gradle
          echo "versionName=${{ inputs.version }} versionCode=$NEW_VC"
          grep -E 'versionCode|versionName' app/build.gradle | head -2

      # Release signing (moon's 2026-11-09): the release keystore lives only
      # in GitHub Secrets (ANDROID_KEYSTORE_BASE64 + passwords) — never in
      # the repo. Decode it and write keystore.properties so the release
      # signingConfig in app/build.gradle picks it up. If the secrets are
      # missing this step fails loudly instead of silently shipping unsigned.
      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/moonstream.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/moonstream.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          test -s keystore/moonstream.jks && test -s keystore.properties

      - name: Build APK (release, signed)
        run: ./gradlew :app:assembleRelease --stacktrace

      # Rename APKs so the release assets carry the version + ABI.
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          for f in *arm64-v8a*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-arm64-v8a.apk"; done
          for f in *armeabi-v7a*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-armeabi-v7a.apk"; done
          for f in *x86_64*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-x86_64.apk"; done
          for f in *universal*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-universal.apk"; done
          ls -la

      # One artifact per ABI so each downloads as its own file.
      # The POCO M4 Pro needs arm64-v8a.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: warn
          retention-days: 14

      # OTA: publish a GitHub Release so the in-app updater finds it.
      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MoonStream v${{ inputs.version }}
          body: |
            MoonStream v${{ inputs.version }}

            Install the APK matching your phone (most phones: arm64-v8a).
            Or update from inside the app: Settings → Check for updates.
          files: app/build/outputs/apk/release/*.apk
