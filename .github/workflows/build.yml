name: Build Android APK

# Manual only — run it from the Actions tab with "Run workflow".
# - version: the release version, e.g. 0.9.0. The workflow writes this into
#   app/build.gradle as versionName (and bumps versionCode) before building,
#   so the APK's internal version always matches the release tag. This is
#   what the in-app updater compares — a mismatch caused the 0.8.2 "update
#   loop" bug (release said 0.8.2, APK inside still said 0.8.0).
# - publish_release: when true, creates a GitHub Release tagged v<version>
#   with the per-ABI APKs attached, which is what the app's in-app
#   updater (Settings → Check for updates) reads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.9.0)"
        required: true
        default: "0.9.0"
      publish_release:
        description: "Publish a GitHub Release with the APKs (for OTA updates)"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history + tags: the changelog step diffs against the previous tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Sync versionName from the workflow input and bump versionCode, so
      # the APK's internal version always matches the release tag. Without
      # this, a manually-typed version (e.g. 0.8.2) produces an APK that
      # still reports the old versionName (e.g. 0.8.0) — and the in-app
      # updater offers the "update" forever.
      - name: Sync version from input
        run: |
          VC=$(grep -oP 'versionCode \K\d+' app/build.gradle)
          NEW_VC=$((VC + 1))
          sed -i -E "s/versionCode [0-9]+/versionCode $NEW_VC/" app/build.gradle
          sed -i -E "s/versionName '[^']+'/versionName '${{ inputs.version }}'/" app/build.gradle
          echo "versionName=${{ inputs.version }} versionCode=$NEW_VC"
          grep -E 'versionCode|versionName' app/build.gradle | head -2

      # Release signing (moon's 2026-11-09): the release keystore lives only
      # in GitHub Secrets (ANDROID_KEYSTORE_BASE64 + passwords) — never in
      # the repo. Decode it and write keystore.properties so the release
      # signingConfig in app/build.gradle picks it up. If the secrets are
      # missing this step fails loudly instead of silently shipping unsigned.
      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/moonstream.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/moonstream.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          test -s keystore/moonstream.jks && test -s keystore.properties

      - name: Build APK (release, signed)
        run: ./gradlew :app:assembleRelease --stacktrace

      # Rename APKs so the release assets carry the version + ABI.
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/release
          for f in *arm64-v8a*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-arm64-v8a.apk"; done
          for f in *armeabi-v7a*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-armeabi-v7a.apk"; done
          for f in *x86_64*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-x86_64.apk"; done
          for f in *universal*.apk; do [ -f "$f" ] && mv "$f" "MoonStream-${{ inputs.version }}-universal.apk"; done
          ls -la

      # Delta-update patches (moon's 2026-11-22): a small patch per ABI
      # between the previous release's APK and this one, so the in-app
      # updater downloads ~3 MB instead of 41 MB. Patches are an
      # optimization — any failure here skips them, never the build.
      - name: Build delta patches
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p patches
          PREV=$(git tag --sort=-v:refname | grep -v "^v${{ inputs.version }}$" | head -n 1)
          if [ -z "$PREV" ]; then echo "No previous release — skipping patches"; exit 0; fi
          PREV_VER=${PREV#v}
          echo "Previous release: $PREV ($PREV_VER)"
          if ! python3 -m pip install --quiet bsdiff4; then echo "bsdiff4 install failed — skipping patches"; exit 0; fi
          mkdir -p prev
          if ! gh release download "$PREV" --pattern '*-arm64-v8a.apk' --pattern '*-armeabi-v7a.apk' --pattern '*-x86_64.apk' --dir prev; then echo "Previous APKs unavailable — skipping patches"; exit 0; fi
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            OLD="prev/MoonStream-$PREV_VER-$ABI.apk"
            NEW="app/build/outputs/apk/release/MoonStream-${{ inputs.version }}-$ABI.apk"
            if [ -f "$OLD" ] && [ -f "$NEW" ]; then
              python3 tools/make_patch.py "$OLD" "$NEW" "$PREV_VER" "${{ inputs.version }}" "patches/MoonStream-$PREV_VER-to-${{ inputs.version }}-$ABI.patch" || echo "Patch failed for $ABI — skipping"
            else
              echo "Missing APK for $ABI — skipping patch"
            fi
          done
          ls -la patches/

      # One artifact per ABI so each downloads as its own file.
      # The POCO M4 Pro needs arm64-v8a.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-arm64-v8a
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-armeabi-v7a
          path: app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-x86_64
          path: app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonStream-universal
          path: app/build/outputs/apk/release/*universal*.apk
          if-no-files-found: warn
          retention-days: 14

      # Changelog for the release body (moon's 2026-11-18): the in-app
      # update popup shows the release body as the changelog, so it must
      # list what changed — commit subjects since the previous tag.
      # (Before this the body was install instructions, so the popup
      # showed instructions where the changelog belongs.)
      - name: Build changelog
        run: |
          PREV=$(git tag --sort=-v:refname | grep -v "^v${{ inputs.version }}$" | head -n 1)
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --pretty=format:"- %s" > changelog.txt
          else
            git log --pretty=format:"- %s" -10 > changelog.txt
          fi
          cat changelog.txt

      # OTA: publish a GitHub Release so the in-app updater finds it.
      - name: Publish GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: MoonStream v${{ inputs.version }}
          body_path: changelog.txt
          files: |
            app/build/outputs/apk/release/*.apk
            patches/*.patch
