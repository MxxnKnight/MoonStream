org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Sandbox blocks Java TCP on IPv6/dual-stack loopback, which breaks the Kotlin
# compile daemon protocol — force IPv4 for it too.
kotlin.daemon.jvmargs=-Djava.net.preferIPv4Stack=true
# Fallback: run the Kotlin compiler in-process (inside the Gradle daemon,
# which already has IPv4 forced) if the separate compile daemon can't connect.
kotlin.compiler.execution.strategy=in-process
